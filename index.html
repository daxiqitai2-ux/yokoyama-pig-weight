<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>体重測定アプリ － 横山養豚</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --surface2: #f0ede6;
      --border: #e0dbd0;
      --border2: #ccc8bc;
      --accent: #5a7a3a;
      --accent2: #4a6a2a;
      --accent-light: #e8f0e0;
      --danger: #c0392b;
      --danger-light: #fdecea;
      --text: #2c2c2c;
      --text2: #666;
      --text3: #999;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow2: 0 4px 16px rgba(0,0,0,0.12);
      --radius: 10px;
      --radius2: 6px;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ヘッダー */
    .header {
      background: var(--accent);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-icon { font-size: 1.5rem; }
    .header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.03em; }
    .header-sub { font-size: 0.75rem; opacity: 0.8; margin-top: 1px; }

    /* タブ */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 57px;
      z-index: 99;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text2);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--accent-light);
    }

    /* コンテンツ */
    .content { padding: 16px; max-width: 600px; margin: 0 auto; }
    .section { display: none; }
    .section.active { display: block; }

    /* カード */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* フォーム */
    .form-row { margin-bottom: 12px; }
    .form-row label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius2);
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .form-row textarea { resize: vertical; min-height: 70px; }

    /* ボタン */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 20px;
      border: none;
      border-radius: var(--radius2);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text2);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--danger); color: #fff; font-size: 0.8rem; padding: 6px 12px; }
    .btn-danger:hover { background: #a93226; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ステータス */
    .status-msg {
      padding: 10px 14px;
      border-radius: var(--radius2);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 12px;
      display: none;
    }
    .status-msg.show { display: block; }
    .status-msg.success { background: var(--accent-light); color: var(--accent2); border: 1px solid #b8d4a0; }
    .status-msg.error { background: var(--danger-light); color: var(--danger); border: 1px solid #f5c6c1; }
    .status-msg.loading { background: #e8f4fd; color: #1a6b9c; border: 1px solid #b8d8f0; }

    /* 記録リスト */
    .record-list { list-style: none; }
    .record-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: box-shadow 0.2s;
    }
    .record-item:hover { box-shadow: var(--shadow2); }
    .record-left { flex: 1; min-width: 0; }

    .record-weight {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }
    .record-weight span { font-size: 0.8rem; font-weight: 500; color: var(--text2); margin-left: 2px; }
    .record-date {
      font-size: 0.75rem;
      color: var(--text3);
      margin-top: 2px;
      font-family: 'DM Mono', monospace;
    }
    .record-memo {
      font-size: 0.8rem;
      color: var(--text2);
      margin-top: 4px;
      word-break: break-all;
    }
    .record-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

    /* 統計 */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-item {
      background: var(--surface2);
      border-radius: var(--radius2);
      padding: 12px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .stat-label { font-size: 0.75rem; color: var(--text2); margin-bottom: 4px; }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); font-family: 'DM Mono', monospace; }
    .stat-unit { font-size: 0.7rem; color: var(--text3); }

    /* フィルター */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filter-bar input, .filter-bar select {
      padding: 8px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius2);
      font-family: inherit;
      font-size: 0.85rem;
      background: var(--surface);
      flex: 1;
      min-width: 120px;
    }
    .filter-bar input:focus, .filter-bar select:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* バッジ */
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--danger);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 6px;
      margin-left: 4px;
    }

    /* 空状態 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text3);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; }

    /* ローダー */
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow2);
    }
    .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .modal p { font-size: 0.9rem; color: var(--text2); margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* レスポンシブ */
    @media (max-width: 380px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">🐷</div>
  <div>
    <h1>体重測定アプリ</h1>
    <div class="header-sub">横山養豚</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('input')" id="tab-input">
    ✏️ 入力
  </button>
  <button class="tab-btn" onclick="switchTab('list')" id="tab-list">
    📋 一覧 <span class="badge" id="record-count-badge" style="display:none">0</span>
  </button>
  <button class="tab-btn" onclick="switchTab('stats')" id="tab-stats">
    📊 集計
  </button>
</div>

<div class="content">

  <!-- 入力タブ -->
  <div class="section active" id="section-input">
    <div class="card">
      <div class="card-title">🐖 体重を記録する</div>

      <div id="input-status" class="status-msg"></div>

      <div class="form-row">
        <label>📅 測定日</label>
        <input type="date" id="input-date">
      </div>

      <div class="form-row">
        <label>⚖️ 体重 (kg)</label>
        <input type="number" id="input-weight" placeholder="例: 85.5" step="0.1" min="0" inputmode="decimal">
      </div>

      <div class="form-row">
        <label>📝 メモ（任意）</label>
        <textarea id="input-memo" placeholder="体調、特記事項など"></textarea>
      </div>

      <button class="btn btn-primary" id="save-btn" onclick="saveRecord()">
        <span id="save-btn-text">💾 保存する</span>
      </button>
    </div>

    <div class="card">
      <div class="card-title">📤 エクスポート</div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="exportExcel()">📊 Excel出力</button>
        <button class="btn btn-secondary" onclick="exportCSV()">📄 CSV出力</button>
      </div>
    </div>
  </div>

  <!-- 一覧タブ -->
  <div class="section" id="section-list">
    <div class="card">
      <div class="card-title">🔍 絞り込み</div>
      <div class="filter-bar">
        <input type="date" id="filter-date-from" onchange="renderList()">
        <span style="align-self:center;color:var(--text3);font-size:0.8rem">〜</span>
        <input type="date" id="filter-date-to" onchange="renderList()">
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="clearFilter()">🔄 クリア</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDeleteAll()">🗑️ 全削除</button>
      </div>
    </div>

    <div id="list-status" class="status-msg"></div>

    <ul class="record-list" id="record-list">
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <p>読み込み中...</p>
      </div>
    </ul>
  </div>

  <!-- 集計タブ -->
  <div class="section" id="section-stats">
    <div id="stats-status" class="status-msg"></div>

    <div class="card">
      <div class="card-title">📊 全体統計</div>
      <div class="stats-grid" id="stats-grid">
        <div class="stat-item">
          <div class="stat-label">記録件数</div>
          <div class="stat-value" id="stat-count">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">平均体重</div>
          <div class="stat-value" id="stat-avg">—</div>
          <div class="stat-unit">kg</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">最大体重</div>
          <div class="stat-value" id="stat-max">—</div>
          <div class="stat-unit">kg</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">最小体重</div>
          <div class="stat-value" id="stat-min">—</div>
          <div class="stat-unit">kg</div>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- 削除確認モーダル -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h3>⚠️ 削除の確認</h3>
    <p id="delete-modal-msg">この記録を削除してもよいですか？</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-danger" id="modal-confirm-btn" onclick="executeDelete()">削除する</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://crimson-credit-a3df.daxiqitai2.workers.dev';
  const KV_KEY = 'yokoyama_pig_weight_records';
  let records = [];
  let deleteTarget = null; // 'all' or record id

  // ========== 初期化 ==========
  window.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('input-date').value = today;
    loadRecords();
  });

  // ========== タブ切り替え ==========
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    document.getElementById('section-' + name).classList.add('active');
    if (name === 'list') renderList();
    if (name === 'stats') renderStats();
  }

  // ========== KV API ==========
  async function loadRecords() {
    try {
      const res = await fetch(`${API_BASE}/kv/get?key=${encodeURIComponent(KV_KEY)}`);
      if (!res.ok) throw new Error('通信エラー');
      const data = await res.json();
      records = data.value ? JSON.parse(data.value) : [];
      updateBadge();
      renderList();
      renderStats();
    } catch (e) {
      showStatus('list-status', 'error', '⚠️ データの読み込みに失敗しました: ' + e.message);
    }
  }

  async function saveToKV() {
    const res = await fetch(`${API_BASE}/kv/put`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KV_KEY, value: JSON.stringify(records) })
    });
    if (!res.ok) throw new Error('保存エラー');
  }

  // ========== 保存 ==========
  async function saveRecord() {
    const date   = document.getElementById('input-date').value.trim();
    const weight = document.getElementById('input-weight').value.trim();
    const memo   = document.getElementById('input-memo').value.trim();

    if (!date || !weight) {
      showStatus('input-status', 'error', '⚠️ 測定日・体重は必須です');
      return;
    }
    if (isNaN(Number(weight)) || Number(weight) <= 0) {
      showStatus('input-status', 'error', '⚠️ 体重は正の数値を入力してください');
      return;
    }

    const btn = document.getElementById('save-btn');
    const btnText = document.getElementById('save-btn-text');
    btn.disabled = true;
    btnText.innerHTML = '<span class="loader"></span> 保存中...';
    showStatus('input-status', 'loading', '⏳ 保存中...');

    try {
      const newRecord = {
        id: Date.now().toString(),
        date,
        weight: Number(weight),
        memo,
        createdAt: new Date().toISOString()
      };
      records.push(newRecord);
      records.sort((a, b) => b.date.localeCompare(a.date));
      await saveToKV();

      showStatus('input-status', 'success', '✅ 保存しました！');
      document.getElementById('input-weight').value = '';
      document.getElementById('input-memo').value = '';
      updateBadge();
    } catch (e) {
      records.pop();
      showStatus('input-status', 'error', '❌ 保存に失敗しました: ' + e.message);
    } finally {
      btn.disabled = false;
      btnText.innerHTML = '💾 保存する';
    }
  }

  // ========== 一覧 ==========
  function renderList() {
    const filterDateFrom = document.getElementById('filter-date-from')?.value || '';
    const filterDateTo   = document.getElementById('filter-date-to')?.value || '';

    let filtered = records.filter(r => {
      if (filterDateFrom && r.date < filterDateFrom) return false;
      if (filterDateTo   && r.date > filterDateTo)   return false;
      return true;
    });

    const list = document.getElementById('record-list');

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>${records.length === 0 ? 'まだ記録がありません' : '該当する記録がありません'}</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(r => `
      <li class="record-item">
        <div class="record-left">
          <div class="record-weight">${r.weight}<span>kg</span></div>
          <div class="record-date">📅 ${r.date}</div>
          ${r.memo ? `<div class="record-memo">💬 ${escHtml(r.memo)}</div>` : ''}
        </div>
        <div class="record-actions">
          <button class="btn btn-danger btn-sm" onclick="confirmDeleteRecord('${r.id}')">🗑️</button>
        </div>
      </li>
    `).join('');
  }

  function clearFilter() {
    document.getElementById('filter-date-from').value = '';
    document.getElementById('filter-date-to').value = '';
    renderList();
  }

  // ========== 削除 ==========
  function confirmDeleteRecord(id) {
    deleteTarget = id;
    document.getElementById('delete-modal-msg').textContent = 'この記録を削除してもよいですか？';
    document.getElementById('delete-modal').classList.add('show');
  }

  function confirmDeleteAll() {
    if (records.length === 0) { showStatus('list-status', 'error', '削除するデータがありません'); return; }
    deleteTarget = 'all';
    document.getElementById('delete-modal-msg').textContent = `全 ${records.length} 件のデータをすべて削除します。この操作は取り消せません。`;
    document.getElementById('delete-modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('delete-modal').classList.remove('show');
    deleteTarget = null;
  }

  async function executeDelete() {
    closeModal();
    if (deleteTarget === 'all') {
      records = [];
    } else {
      records = records.filter(r => r.id !== deleteTarget);
    }
    try {
      await saveToKV();
      updateBadge();
      renderList();
      renderStats();
      showStatus('list-status', 'success', '✅ 削除しました');
    } catch (e) {
      showStatus('list-status', 'error', '❌ 削除に失敗しました: ' + e.message);
    }
  }

  // ========== 集計 ==========
  function renderStats() {
    if (records.length === 0) {
      document.getElementById('stat-count').textContent = '0';
      document.getElementById('stat-avg').textContent = '—';
      document.getElementById('stat-max').textContent = '—';
      document.getElementById('stat-min').textContent = '—';
      return;
    }

    const weights = records.map(r => r.weight);
    const avg = weights.reduce((a,b) => a+b, 0) / weights.length;
    const max = Math.max(...weights);
    const min = Math.min(...weights);

    document.getElementById('stat-count').textContent = records.length;
    document.getElementById('stat-avg').textContent = avg.toFixed(1);
    document.getElementById('stat-max').textContent = max.toFixed(1);
    document.getElementById('stat-min').textContent = min.toFixed(1);
  }

  // ========== エクスポート ==========
  function exportExcel() {
    if (records.length === 0) { alert('データがありません'); return; }
    const data = records.map(r => ({
      '測定日': r.date, '体重(kg)': r.weight, 'メモ': r.memo || ''
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '体重記録');
    XLSX.writeFile(wb, `pig_weight_${new Date().toISOString().split('T')[0]}.xlsx`);
  }

  function exportCSV() {
    if (records.length === 0) { alert('データがありません'); return; }
    const header = '測定日,体重(kg),メモ\n';
    const rows = records.map(r =>
      `${r.date},${r.weight},"${(r.memo||'').replace(/"/g,'""')}"`
    ).join('\n');
    const bom = '\uFEFF';
    const blob = new Blob([bom + header + rows], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `pig_weight_${new Date().toISOString().split('T')[0]}.csv`;
    a.click(); URL.revokeObjectURL(url);
  }

  // ========== ユーティリティ ==========
  function showStatus(id, type, msg) {
    const el = document.getElementById(id);
    el.className = `status-msg ${type} show`;
    el.textContent = msg;
    if (type === 'success') setTimeout(() => el.classList.remove('show'), 3000);
  }

  function updateBadge() {
    const badge = document.getElementById('record-count-badge');
    if (records.length > 0) {
      badge.textContent = records.length > 99 ? '99+' : records.length;
      badge.style.display = 'inline-flex';
    } else {
      badge.style.display = 'none';
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
